baseURL = 'https://blog.sunisalex.org/'
languageCode = 'en-us'
title = 'Alexの小站'
theme = 'FixIt'
[params]
  capitalizeTitles = false     # 关闭 FixIt 的标题自动大写
[markup]

[markup.goldmark]

[markup.goldmark.extensions]

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [
  [
    '\[',
    '\]'
  ],
  [
    '$$',
    '$$'
  ]
]
inline = [
  [
    '\(',
    '\)'
  ],
  [
    '$',
    '$'
  ]
]

[params.page]

[params.page.math]
enable = true
type = "katex"


[params.busuanzi]
enable = true
pageViews = true
siteViews = true
source = 'https://vercount.one/js'

[params.cookieconsent]
enable = true